name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# One run per ref; a new push cancels the in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build, test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # Keyed on the csproj files; no packages.lock.json in this repo.
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore DotnetApiSample.slnx

      - name: Build
        run: dotnet build DotnetApiSample.slnx --no-restore --configuration Release

      # Integration tests use Testcontainers, which needs the Docker daemon
      # that ubuntu-latest runners provide out of the box. No secrets required:
      # the fixture starts its own PostgreSQL and injects the connection string.
      - name: Test
        run: >-
          dotnet test DotnetApiSample.slnx
          --no-build --configuration Release
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
